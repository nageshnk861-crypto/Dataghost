// ─── DataGhost Android Enterprise Agent – App build.gradle ───────────────────
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.dataghost.agent'
    compileSdk 34

    defaultConfig {
        applicationId "com.dataghost.agent"
        minSdk 26          // Android 8.0 (Oreo) — minimum for Android Enterprise
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // Android Enterprise / Work Profile DPC identifier
        // Must match the component name in enrollment QR payload
        manifestPlaceholders = [dpcPackageName: "com.dataghost.agent"]
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // ── Core AndroidX ──────────────────────────────────────────────────────────
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // ── WorkManager (background heartbeat) ─────────────────────────────────────
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // ── Network — OkHttp + Gson ────────────────────────────────────────────────
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // ── Coroutines ────────────────────────────────────────────────────────────
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // ── QR Code Scanning — ML Kit (optional, add if using camera QR scan) ────
    // implementation 'com.google.mlkit:barcode-scanning:17.2.0'
    // implementation 'androidx.camera:camera-camera2:1.3.1'
    // implementation 'androidx.camera:camera-lifecycle:1.3.1'
    // implementation 'androidx.camera:camera-view:1.3.1'

    // ── Tests ─────────────────────────────────────────────────────────────────
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'org.mockito:mockito-core:5.7.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.1.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
}
